<script>
// Classic script: still runs when the module scripts cannot (file:// pages, a missing module).
(function () {
  var q = location.search, ja = /lang=ja/.test(q) || (/kiosk/.test(q) && !/lang=en/.test(q));
  function show(en, jp) {
    var s = document.querySelector('#loading span');
    var sp = document.querySelector('#loading .spinner');
    if (!s || document.body.getAttribute('data-ready')) return;
    if (sp) sp.style.display = 'none';
    s.textContent = ja ? jp + '\n' + en : en + '\n' + jp;
    s.className = 'loadmsg';
  }
  if (location.protocol === 'file:') {
    show('This page has to be opened through a small local web server: double-click “View-locally.bat”, next to the “docs” folder.',

    setTimeout(function () {
      if (!window.__app) show('The 3D view could not start. Please reload the page.',
